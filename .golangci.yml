version: "2"

# Report everything. The defaults (max-same-issues: 3, max-issues-per-linter: 50)
# silently truncate: while writing this config, G302's 4th occurrence in main.go
# was hidden purely because three others were reported first, and it only
# appeared once the test exclusions removed two of them. A phase gate whose
# output depends on how many times a linter happened to fire is not a gate.
issues:
  max-same-issues: 0
  max-issues-per-linter: 0

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec
    - revive

  # Scope decision, not a silenced failure. build/ios/ and build/android/ are
  # Wails scaffold — generated by `wails3 init`, never written by us, and
  # regenerated by a framework upgrade. They target platforms this project
  # does not ship: NFR-03 lists macOS and Windows, with Linux deferred to v2;
  # mobile appears nowhere in the TZ, the CI matrix, or the build story.
  # Their gosec G204 hits ("subprocess launched with variable") are not
  # defects either — those files are dependency installers, and shelling out
  # to a package manager is the job. Linting code we neither wrote nor ship
  # produces noise, and noisy lint is how teams learn to ignore lint.
  #
  # Deliberately NOT `build/` wholesale: build/darwin/ and build/windows/ are
  # platforms we ship, so any Go code landing there must be linted. (Neither
  # they nor build/linux/ and build/docker/ contain Go files today.)
  exclusions:
    paths:
      - build/ios
      - build/android

    # gosec models production risk: an insecure mode or a tainted path that
    # ships. Three of our tests deliberately seed the insecure state they
    # exist to prove gets repaired — TestEnsureDataDirTightensAnExistingLooseFolder
    # seeds a 0755 folder precisely to show EnsureDataDir tightens it, and
    # db_test seeds a 0644 WAL to show Open repairs it. The loose mode IS the
    # fixture; a rule demanding the test seed 0750 would be asking the test to
    # stop testing. Scoped by linter AND path — gosec stays fully live on all
    # production code, which is where it earns its keep.
    rules:
      - linters:
          - gosec
        path: _test\.go

formatters:
  enable:
    - gofmt
    - goimports

  # Same scaffold, same reasoning — and the formatters section needs its own
  # exclusion list, since linters.exclusions does not cover it.
  exclusions:
    paths:
      - build/ios
      - build/android
