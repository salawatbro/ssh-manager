version: '3'

vars:
  APP_NAME: "sshmgr"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Target OS for build/package/run. Defaults to the host OS, and is overridden
  # by `wails3 build GOOS=...` (or the GOOS env var) for cross-compilation. The
  # tasks below dispatch to the matching platform Taskfile via this variable.
  GOOS: '{{.GOOS | default OS}}'
  # The app version has exactly one home: build/config.yml's info.version.
  # Everything else — Info.plist, the DMG name, the About screen — is derived
  # from it, and `task check` proves they agree. Bump it with `task bump`.
  #
  # The two-space indent and the double quotes in the pattern are load-bearing:
  # config.yml also has an unindented, single-quoted `version: '3'` on line 4,
  # which is the schema version and must not be picked up.
  VERSION:
    sh: |
      sed -n 's/^  version: "\([^"]*\)".*/\1/p' build/config.yml

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml
  ios: ./build/ios/Taskfile.yml
  android: ./build/android/Taskfile.yml

tasks:
  version:verify:
    internal: true
    summary: Fails if the version could not be read out of build/config.yml
    # A failed extraction yields an EMPTY VERSION, and empty is the dangerous
    # value: the DMG would be built as "Zish-.dmg" and the drift guard would
    # compare empty against empty and pass. Everything that uses VERSION runs
    # this first.
    # A shell glob (case ... [0-9]*.[0-9]*.[0-9]*) is not semver validation:
    # `.` matches any character and `*` matches anything, including empty, so
    # it would wave through "9.9.9.9", "9a.9b.9c" or "9 9.9.9". grep -E with
    # anchors gives an actual x.y.z check instead.
    # Same mvdan/sh trap as the guards in `check`: a false `if` with no `else`
    # returns the condition's status, so this needs its own trailing `exit 0`
    # regardless of which branch of the `if` below ran.
    cmds:
      - cmd: |
          v="{{.VERSION}}"
          if ! printf '%s' "$v" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "XATO: build/config.yml dan versiya o'qilmadi (topilgani: '$v')"
            echo "  Kutilgan qator: '  version: \"x.y.z\"' (info: ostida, ikki bo'sh joy, qo'shtirnoq)"
            exit 1
          fi
          exit 0

  bump:
    desc: "Set the app version everywhere: task bump NEW=x.y.z"
    # Three files, and that is the whole list: the darwin Taskfile and the
    # About screen derive their value from build/config.yml rather than
    # carrying a copy, so there is nothing to write there.
    #
    # Info.plist is edited IN PLACE. Do not reach for
    # `wails3 task common:update:build-assets` -- CLAUDE.md forbids it: it
    # rebuilds Info.plist from a template and can reintroduce CFBundleIconName,
    # which makes macOS prefer a nonexistent Assets.car over icons.icns.
    #
    # sed writes through a temp file rather than -i, because BSD sed (macOS)
    # requires an argument to -i and GNU sed refuses one. Each sed/mv pair is
    # joined with && so mv only ever promotes a temp file that sed actually
    # succeeded in writing — go-task's cmd blocks are not run under `set -e`,
    # so a bare sed failure followed by an unconditional mv would silently
    # overwrite the real tracked file with an empty or partial temp file.
    #
    # NEW is validated with grep -E, not a shell glob: a glob's `.` matches
    # any character and `*` matches anything including empty, so it would let
    # through "9.9.9.9", "9a.9b.9c", "9.9.9-rc1" or a value crafted to break
    # out of the sed expression below. grep -E with anchors is an actual
    # x.y.z check, and mirrors the same check in version:verify.
    deps:
      - task: version:verify
    cmds:
      - cmd: |
          new="{{.NEW}}"
          if ! printf '%s' "$new" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "XATO: NEW semver x.y.z bo'lishi kerak (berilgani: '$new')"
            echo "  Shakl: task bump NEW=x.y.z"
            exit 1
          fi
          old="{{.VERSION}}"
          if [ "$old" = "$new" ]; then
            echo "Versiya allaqachon $new — o'zgarish yo'q."
            exit 0
          fi
          # Dots are regex wildcards; escape them so x.y.z cannot match xXyYz.
          esc=$(printf '%s' "$old" | sed 's|\.|\\.|g')

          sed "s|^  version: \"$esc\"|  version: \"$new\"|" build/config.yml > build/config.yml.tmp && mv build/config.yml.tmp build/config.yml

          sed "s|<string>$esc</string>|<string>$new</string>|g" build/darwin/Info.plist > build/darwin/Info.plist.tmp && mv build/darwin/Info.plist.tmp build/darwin/Info.plist

          sed "s|Zish-$esc\.dmg|Zish-$new.dmg|g" README.md > README.md.tmp && mv README.md.tmp README.md

          echo "Versiya $old -> $new"
          git diff --stat -- build/config.yml build/darwin/Info.plist README.md
          echo "CHANGELOG.md qo'lda yangilanadi."
          exit 0

  check:
    desc: Bosqich darvozasi — TZ 15.1
    deps:
      - task: version:verify
    cmds:
      # The frontend goes first and the order is not cosmetic: main.go carries
      # //go:embed all:frontend/dist and dist/ is gitignored. On a clean clone
      # every Go command below — vet, lint, test — fails to even load the
      # package with "pattern all:frontend/dist: no matching files found".
      - cd frontend && npx tsc --noEmit
      - cd frontend && npm run build
      - cd frontend && npm test

      - go vet ./...
      - golangci-lint run
      - go test ./... -race -cover
      - govulncheck ./...

      # SEC-02: this must never appear in the codebase.
      #
      # The trailing `exit 0` is load-bearing, and its absence is a trap.
      # Task does not use system sh — it embeds mvdan/sh, and there an `if`
      # whose condition is false and which has no else branch yields the
      # *condition's* status, not 0 as POSIX specifies. grep exits 1 when it
      # finds nothing, so without this line the guard fails exactly when the
      # banned string is absent: the gate could never pass. Verified both
      # ways — absent yields 0 and continues, present still prints XATO and
      # fails.
      - cmd: |
          if grep -rn "InsecureIgnoreHostKey" --include="*.go" .; then
            echo "XATO: InsecureIgnoreHostKey ishlatilgan"
            exit 1
          fi
          exit 0
      # The cgo sqlite driver must never come back (Global Constraints).
      # go.mod only: go.sum legitimately carries a gorm.io/driver/sqlite
      # checksum pulled in by gorm's own external test package. It is not
      # linked — the dep graph has neither mattn/go-sqlite3 nor
      # gorm.io/driver/sqlite, and the implementation is modernc.org/libc,
      # pure Go. Grepping go.sum would fail on that false positive.
      # The trailing `exit 0` is required here for the same reason as above.
      - cmd: |
          if grep -rn "gorm.io/driver/sqlite" go.mod; then
            echo "XATO: cgo sqlite driver ishlatilgan"
            exit 1
          fi
          exit 0

      # Global Constraint: every React component lives in one file, and that
      # file never exceeds 250 lines. Nothing machine-checked this before —
      # ServerForm.tsx drifted to 225 lines while the project record still
      # claimed 196 — which is exactly how it went unnoticed. This checks
      # every file under frontend/src, not just components, since the cap is
      # simplest to enforce uniformly and a 250+ line non-component file would
      # be worth a look too.
      # Same mvdan/sh trap as the two guards above, same fix: a false `if`
      # with no `else` returns the *condition's* status, not 0, so this needs
      # its own trailing `exit 0`.
      - cmd: |
          offenders=$(
            for f in $(find frontend/src -type f); do
              n=$(wc -l < "$f")
              if [ "$n" -gt 250 ]; then
                echo "$f: $n qator"
              fi
            done
          )
          if [ -n "$offenders" ]; then
            echo "XATO: 250 qatordan oshgan fayl(lar) (Global Constraint):"
            echo "$offenders"
            exit 1
          fi
          exit 0

      # The app version lives in build/config.yml's info.version and nowhere
      # else. These two guards prove the derived copies still agree with it,
      # because a release that ships with one file left behind is silent: the
      # DMG carries the new name while macOS reads the old CFBundleVersion.
      # Fix any failure with `task bump NEW=<version>`.
      # Same mvdan/sh trap as the guards above — trailing `exit 0` required.
      - cmd: |
          v="{{.VERSION}}"
          for key in CFBundleShortVersionString CFBundleVersion; do
            got=$(grep -A1 "<key>$key</key>" build/darwin/Info.plist | tail -1 | tr -d ' \t')
            if [ "$got" != "<string>$v</string>" ]; then
              echo "XATO: build/darwin/Info.plist $key = $got, kutilgan <string>$v</string>"
              echo "  Tuzatish: task bump NEW=$v"
              exit 1
            fi
          done
          # Dots in $v are regex wildcards to grep; escape them the same way
          # `bump` does, so the presence check cannot be satisfied by a
          # near-miss like "Zish-1x2y0.dmg".
          esc=$(printf '%s' "$v" | sed 's|\.|\\.|g')
          if ! grep -q "Zish-$esc\.dmg" README.md; then
            echo "XATO: README.md da Zish-$v.dmg topilmadi"
            echo "  Tuzatish: task bump NEW=$v"
            exit 1
          fi
          stale=$(grep -oE 'Zish-[0-9]+\.[0-9]+\.[0-9]+\.dmg' README.md | grep -v "^Zish-$v\.dmg$" || true)
          if [ -n "$stale" ]; then
            echo "XATO: README.md da eskirgan DMG nomi:"
            echo "$stale"
            exit 1
          fi
          exit 0

      # Stage two: catch a NEW copy of the version appearing somewhere the
      # first guard does not know to look — which is exactly how the version
      # ended up in nine places to begin with.
      #
      # git ls-files rather than find, so gitignored trees (node_modules,
      # dist, bin, .superpowers) are excluded for free and stay excluded.
      # The files below are excluded, and why. build/config.yml legitimately
      # holds the version — it is the source (version:verify above already
      # checks it, so a match there is not news). build/darwin/Info.plist and
      # README.md also legitimately hold the version (stage one above already
      # checks those, so a match there is not news either).
      # CHANGELOG.md legitimately holds a history of past versions.
      # package-lock.json is excluded because a dependency constraint can
      # coincidentally match the app version — it carries a
      # use-sync-external-store constraint whose value happens to equal the
      # app version today, which is not a copy of anything. docs/ holds dated
      # snapshots, not consumers.
      #
      # Honest limit: this catches a new FILE. It cannot catch a new copy
      # added inside an already-allowlisted file, such as a second hardcoded
      # version string tucked into CHANGELOG.md or docs/ — those files' own
      # contents are excluded from this scan entirely and stage one never
      # inspects them either.
      #
      # Taskfile.yml is deliberately NOT excluded. It is the file that owns
      # the single source (VERSION, version:verify, bump all live here), so
      # it is the most likely place a future maintainer would reintroduce a
      # hardcoded pin, and it must stay in scope for this scan to catch that.
      # grep -IlF below is a substring match, not a whole-line one, so any
      # text in this file — comment or otherwise — that merely *contains* the
      # current version as a substring is enough to name Taskfile.yml here.
      # The illustrative version literals in this file (the two regex-escaping
      # notes above — bump's dot-escaping comment and stage one's
      # "Zish-1x2y0.dmg" note — the two grep -E validation notes, the
      # package-lock.json note two paragraphs up, and the `task bump NEW=...`
      # usage examples in `bump`'s desc and its own error message) are
      # placeholders — x.y.z or the 9.9.9 family — picked so no plausible
      # near-future app version is a substring of them. That is a property of
      # today's placeholders, not a permanent guarantee: if any text in this
      # file ever does collide with the current version, the fix is to reword
      # that text, not to re-add an exclusion for Taskfile.yml.
      # Same mvdan/sh trap — trailing `exit 0` required.
      - cmd: |
          v="{{.VERSION}}"
          hits=$(git ls-files -z -- . \
            ':!:build/config.yml' \
            ':!:build/darwin/Info.plist' \
            ':!:README.md' \
            ':!:CHANGELOG.md' \
            ':!:docs/' \
            ':!:frontend/package-lock.json' \
            | xargs -0 grep -IlF "$v" 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "XATO: versiya $v ruxsat etilmagan fayl(lar)da qattiq yozilgan:"
            echo "$hits"
            echo "  Yagona manba: build/config.yml info.version"
            exit 1
          fi
          exit 0

      # R-05: the data layer must stay free of cgo. The app binary is a
      # different story — Wails links cgo and cannot not.
      - CGO_ENABLED=0 go build ./internal/...
      - wails3 build

  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker

  build:server:
    summary: Builds the application in server mode (no GUI, HTTP server only)
    cmds:
      - task: common:build:server

  run:server:
    summary: Runs the application in server mode
    cmds:
      - task: common:run:server

  build:docker:
    summary: Builds a Docker image for server mode deployment
    cmds:
      - task: common:build:docker

  run:docker:
    summary: Builds and runs the Docker image
    cmds:
      - task: common:run:docker
